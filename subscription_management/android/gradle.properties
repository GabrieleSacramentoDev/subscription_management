# MacBook Air / 8 GB: heap alto compete com IDE + emulador e pode deixar o build mais lento (swap).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

android.useAndroidX=true
# Desligue só se algum plugin antigo quebrar (acelera configuração e compile).
android.enableJetifier=true

# Menos trabalho no AGP em projetos Flutter modernos
android.nonTransitiveRClass=true
android.nonFinalResIds=true

kotlin.incremental=true

# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
